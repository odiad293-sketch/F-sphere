<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> F-Sphere | Email veriication</title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <link rel="stylesheet" href="../styles/auth_global/auth-responsive.css">
    <link rel="stylesheet" href="../styles/auth_global/global.css">
    <link rel="stylesheet" href="../styles/signup/emaiI_verification.css">

</head>

<body>
    <header>
            <div class="right-side">
                <img src="../images/logo.png" alt="logo">
                <h1>F-Sphere</h1>
            </div>
            <div class="left-side">
                <div class="button-container">
                    <button class="login-btn">Login</button>
                    <button class="signup-btn">Signup</button>
                </div>
            </div>
    </header>

    <main>
        <section id="hero-section">
            <div class="email-lcon">
                <span class="material-symbols-outlined">
                    mail
                </span>
            </div>
            <div class="hero-content">
                <h2>Verify your email</h2>
                <p>We've sent a verification link to your email address. Please check your inbox.</p>
            </div>
        </section>

        <section class="main-content">
            <div class="email">
                <p></p>
            </div>
            <button>i have verified my email</button>
        </section>

        <section class="requet-section">
            <span>Didn't receive the email?</span>
            <button>Resend verification email</button>
        </section>
    </main>
</body>

</html>
